<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arquivo Modular — Expresso Astral</title>
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<canvas id="stars"></canvas>
<header>
<div class="brand"><div class="logo">🚂</div><div><b>ARQUIVO MODULAR DO EXPRESSO</b><small>Seções • Publicações • Registros de campanha</small></div></div>
<div class="actions">
<button class="btn" id="lockBtn" onclick="alternarModo()"></button><button class="btn edita" onclick="newPost()">＋ Publicação</button><button class="btn edita" onclick="newSession()">＋ Seção</button><button class="btn" onclick="exportDB()">Exportar</button>
<button class="btn" id="fxBtn" title="Estrelas" onclick="toggleFX()">✨</button><label class="btn edita">Importar<input id="import" type="file" accept=".json" hidden></label>
</div>
</header>
<div class="layout">
<aside><div class="side-title">Seções do arquivo</div><div id="sessionList"></div><div class="side-title">Sistema</div>
<button class="btn" style="width:100%;margin-bottom:7px" onclick="showAll()">▦ Todas as publicações</button>
<button class="btn edita" style="width:100%" onclick="showEditor()">✎ Nova publicação</button></aside>
<main><div id="app"></div></main>
</div>
<div class="modal" id="unlock"><div class="modalbox" style="max-width:430px"><div class="modalhead"><b>👁 Modo espectador</b><button class="btn" onclick="fecharUnlock()">Fechar</button></div><div class="modalcontent"><p style="margin:0 0 12px;opacity:.85">Digite a senha para entrar em modo editor.</p><input id="unlockPwd" type="password" autocomplete="off" placeholder="Senha"><div id="unlockErr" style="color:#ff9baa;min-height:22px;margin-top:9px"></div><div style="display:flex;gap:7px;margin-top:8px"><button class="btn" id="unlockOk" style="flex:1" onclick="tentarDesbloquear()">Entrar em modo editor</button></div></div></div></div>
<div class="modal" id="reader"><div class="modalbox"><div class="modalhead"><b id="readerTitle"></b><button class="btn" onclick="closeReader()">Fechar</button></div><div class="modalcontent" id="readerContent"></div></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
